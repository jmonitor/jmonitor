name: Question / help
description: Ask for help installing, configuring or using JMonitor
labels: [question]
body:
    -   type: markdown
        attributes:
            value: The answer may already be in the [self-hosting guide](https://github.com/jmonitor/jmonitor/blob/master/docker/selfhosted/README.md) or the [PaaS guide](https://github.com/jmonitor/jmonitor/blob/master/docs/paas.md).

    -   type: dropdown
        id: edition
        attributes:
            label: Edition
            options:
                - I don't know / both
                - Cloud (jmonitor.io)
                - Self-hosted
            default: 0

    -   type: textarea
        id: description
        attributes:
            label: Description
        validations:
            required: true
