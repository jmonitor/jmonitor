name: CI

on:
    push:
        branches: [master]
    pull_request:

# A new push supersedes the runs of the previous one, on pull requests only:
# master keeps a run per commit.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    tests:
        name: Lint, static analysis & tests
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v7

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.4'
                    extensions: ctype, iconv, intl, redis
                    coverage: none

            -   name: Install dependencies
                uses: ramsey/composer-install@v4

            -   name: PHP-CS-Fixer
                run: composer run lint:check

            -   name: PHPStan
                run: composer run phpstan

            -   name: PHPUnit
                run: composer run phpunit

            -   name: Lint Twig templates
                run: php bin/console lint:twig templates

            -   name: Lint YAML config
                run: php bin/console lint:yaml config

            -   name: Lint service container
                run: php bin/console lint:container
