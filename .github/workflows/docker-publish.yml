name: Self-hosted image

on:
    push:
        tags: ['v*']
    pull_request:
        paths:
            - 'docker/selfhosted/**'
            - '.dockerignore'
            - '.github/workflows/docker-publish.yml'
            - 'src/**'
            - 'config/**'
            - 'templates/**'
            - 'assets/**'
            - 'migrations/**'
            - 'composer.lock'
            - 'importmap.php'
            - '.env'
    workflow_dispatch:

permissions:
    contents: write # the release step creates a GitHub release on version tags
    packages: write

# Docker Hub is the primary registry, ghcr.io is kept as a mirror (no rate limit fallback).
env:
    IMAGE: ${{ github.repository }}

jobs:
    build:
        name: Build, smoke test & publish
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v7

            # Fails in seconds rather than after the multi-arch build: no image
            # gets published for a version the changelog does not document.
            -   name: Read the release notes from CHANGELOG.md
                if: startsWith(github.ref, 'refs/tags/v')
                run: ./.github/scripts/extract-release-notes.sh "${GITHUB_REF_NAME#v}" > release-notes.md

            -   uses: docker/setup-qemu-action@v4

            -   uses: docker/setup-buildx-action@v4

            -   name: Build image (loaded locally for the smoke test)
                uses: docker/build-push-action@v7
                with:
                    context: .
                    file: docker/selfhosted/Dockerfile
                    load: true
                    tags: ${{ env.IMAGE }}:smoke
                    cache-from: type=gha
                    cache-to: type=gha,mode=max

            -   name: Smoke test (compose up, app:install, HTTP checks, idempotence)
                working-directory: docker/selfhosted
                run: |
                    cp .env.example .env
                    sed -i 's/^APP_DOMAIN=.*/APP_DOMAIN=example.com/' .env
                    sed -i 's/^ADMIN_EMAIL=.*/ADMIN_EMAIL=admin@example.com/' .env
                    sed -i 's/^ADMIN_PASSWORD=.*/ADMIN_PASSWORD=smoke-admin-pw/' .env
                    sed -i "s/CHANGE_ME/$(openssl rand -hex 16)/g" .env

                    export JMONITOR_VERSION=smoke
                    docker compose up -d --wait --wait-timeout 300

                    # Host-header routing + compiled assets
                    test "$(curl -fsS -o /dev/null -w '%{http_code}' -H 'Host: dash.example.com' http://localhost:8080/login)" = "200"
                    curl -fsS -H 'Host: dash.example.com' http://localhost:8080/login | grep -q 'assets/'

                    # Install ran
                    docker compose logs app | grep -q 'Install complete'
                    docker compose logs app | grep -q 'Admin account created: admin@example.com'

                    # Idempotence: restarting the app re-runs app:install harmlessly
                    docker compose restart app
                    docker compose up -d --wait --wait-timeout 300
                    docker compose logs app | grep -q 'already exists, skipping'

                    # Worker is consuming
                    test "$(docker compose ps worker --format '{{.State}}')" = "running"

                    # Self-monitoring: project provisioned on first boot
                    docker compose logs app | grep -q 'Self-monitoring project ready: jmonitor'

                    # ...and metrics flow end-to-end (collector -> DNS alias -> app -> messenger -> worker):
                    # the worker stamps last_data_push_date when it consumes the first push.
                    # 0x... = Project::SELF_MONITORING_UUID (uuid is BINARY(16); hex literal avoids nested quoting)
                    timeout 180 sh -c 'until docker compose exec -T mysql sh -c "mysql -N -p\"\$MYSQL_ROOT_PASSWORD\" jmonitor -e \"SELECT 1 FROM project WHERE uuid = 0x98be4322e5855c5d9aa4c81b0f20b241 AND last_data_push_date IS NOT NULL\"" | grep -q 1; do sleep 5; done'

            -   name: Smoke test native HTTPS (compose.https.yaml overlay, tls internal)
                working-directory: docker/selfhosted
                run: |
                    # Switch the same stack to the native HTTPS overlay. Caddy's internal
                    # CA stands in for Let's Encrypt: CI cannot pass an ACME challenge,
                    # but everything else (TLS termination, redirects, the :2021 internal
                    # listener) is the exact production code path.
                    export JMONITOR_VERSION=smoke  # step env does not carry over from the previous step
                    echo 'COMPOSE_FILE=compose.yaml:compose.https.yaml' >> .env
                    echo 'JMONITOR_TLS=tls internal' >> .env
                    docker compose up -d --wait --wait-timeout 300

                    # TLS + Host routing (-k: internal CA is not in the runner's trust store)
                    test "$(curl -ksS -o /dev/null -w '%{http_code}' --resolve dash.example.com:443:127.0.0.1 https://dash.example.com/login)" = "200"

                    # Port 80 only redirects to HTTPS
                    test "$(curl -sS -o /dev/null -w '%{http_code}' -H 'Host: dash.example.com' http://127.0.0.1:80/login)" = "308"

                    # Internal plain-HTTP listener: the Mercure hub answers on :2021
                    # (401 = handler reached, anonymous subscribe rejected)
                    test "$(docker compose exec -T app curl -s -o /dev/null -w '%{http_code}' http://app:2021/.well-known/mercure)" = "401"

                    # Metrics still flow end-to-end, now through :2021: clear the stamp
                    # and wait for the collector -> app -> worker chain to set it again.
                    docker compose exec -T mysql sh -c "mysql -p\"\$MYSQL_ROOT_PASSWORD\" jmonitor -e \"UPDATE project SET last_data_push_date = NULL WHERE uuid = 0x98be4322e5855c5d9aa4c81b0f20b241\""
                    timeout 180 sh -c 'until docker compose exec -T mysql sh -c "mysql -N -p\"\$MYSQL_ROOT_PASSWORD\" jmonitor -e \"SELECT 1 FROM project WHERE uuid = 0x98be4322e5855c5d9aa4c81b0f20b241 AND last_data_push_date IS NOT NULL\"" | grep -q 1; do sleep 5; done'

            -   name: Dump logs on failure
                if: failure()
                working-directory: docker/selfhosted
                run: docker compose logs || true

            -   name: Log in to Docker Hub
                if: startsWith(github.ref, 'refs/tags/v')
                uses: docker/login-action@v4
                with:
                    username: ${{ secrets.DOCKERHUB_USERNAME }}
                    password: ${{ secrets.DOCKERHUB_TOKEN }}

            -   name: Log in to GitHub Container Registry
                if: startsWith(github.ref, 'refs/tags/v')
                uses: docker/login-action@v4
                with:
                    registry: ghcr.io
                    username: ${{ github.actor }}
                    password: ${{ secrets.GITHUB_TOKEN }}

            -   name: Compute image tags
                if: startsWith(github.ref, 'refs/tags/v')
                id: meta
                uses: docker/metadata-action@v6
                with:
                    images: |
                        ${{ env.IMAGE }}
                        ghcr.io/${{ env.IMAGE }}
                    tags: |
                        type=semver,pattern={{version}}
                        type=semver,pattern={{major}}.{{minor}}

            -   name: Push
                if: startsWith(github.ref, 'refs/tags/v')
                uses: docker/build-push-action@v7
                with:
                    context: .
                    file: docker/selfhosted/Dockerfile
                    push: true
                    platforms: linux/amd64,linux/arm64
                    tags: ${{ steps.meta.outputs.tags }}
                    labels: ${{ steps.meta.outputs.labels }}
                    cache-from: type=gha

            -   name: Sync README to Docker Hub
                if: startsWith(github.ref, 'refs/tags/v')
                uses: peter-evans/dockerhub-description@v5
                with:
                    username: ${{ secrets.DOCKERHUB_USERNAME }}
                    password: ${{ secrets.DOCKERHUB_TOKEN }}
                    repository: ${{ env.IMAGE }}
                    readme-filepath: docker/selfhosted/README.md
                    short-description: Web monitoring for PHP stacks — dashboards and alerts for MySQL, Redis, Nginx, PHP, Symfony...

            # Last: a release is never announced for an image that failed to push.
            -   name: Create the GitHub release
                if: startsWith(github.ref, 'refs/tags/v')
                env:
                    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag
