mercure:
    hubs:
        default:
            url: '%env(default::MERCURE_URL)%'
            # Prefix-less: browsers drop `__Secure-` cookies over plain HTTP, which
            # self-hosted instances may be served on. Same name in every Caddyfile.
            cookie_name: mercure_access_token
            jwt:
                secret: '%env(MERCURE_JWT_SECRET)%'
                publish: '*'
                # `iss` and `aud` must match the `issuer` block and the
                # `resource_identifier` of every Caddyfile's `mercure` directive.
                claims:
                    iss: jmonitor
                    sub: jmonitor
                    client_id: jmonitor
                    aud: https://jmonitor.io/.well-known/mercure
