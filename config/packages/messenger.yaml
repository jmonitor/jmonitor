framework:
    messenger:
        failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 1
                    delay: 10000 # 10 seconds
                    multiplier: 3
            failed: 'doctrine://default?queue_name=failed'
            sync: 'sync://'

        default_bus: messenger.bus.default
        buses:
            messenger.bus.default:
                middleware:
                    # Add the router_context middleware if you need to generate absolute URLs in the consumer (e.g. render a template with links).
                    - router_context

                    # each time a message is handled, the Doctrine connection
                    # is "pinged" and reconnected if it's closed. Useful
                    # if your workers run for a long time and the database
                    # connection is sometimes lost
                    - doctrine_ping_connection

                    # After handling, the Doctrine connection is closed,
                    # which can free up database connections in a worker,
                    # instead of keeping them open forever
                    - doctrine_close_connection

        routing:
            Symfony\Component\Mailer\Messenger\SendEmailMessage: async
            Symfony\Component\Notifier\Message\ChatMessage: async
            Symfony\Component\Notifier\Message\SmsMessage: async

            # App messages
            App\Message\MetricsReceivedMessage: async
            App\Message\CheckAlertMessage: async

            # webhooks (e.g. Stripe)
            Symfony\Component\RemoteEvent\Messenger\ConsumeRemoteEventMessage: async

when@dev:
    framework:
        messenger:
            routing:
                Symfony\Component\Mailer\Messenger\SendEmailMessage: sync
                App\Message\MetricsReceivedMessage: sync
                Symfony\Component\RemoteEvent\Messenger\ConsumeRemoteEventMessage: sync
                App\Message\CheckAlertMessage: sync
