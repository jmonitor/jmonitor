framework:
    rate_limiter:
        passwordLostForm:
            policy: 'fixed_window'
            limit: 2
            interval: '1 minute'
        registerForm:
            policy: 'fixed_window'
            limit: 5
            interval: '1 minute'
        collector.free:
            policy: 'fixed_window'
            limit: 1
            interval: '30 seconds'
        collector.pro:
            policy: 'fixed_window'
            limit: 1
            interval: '15 seconds'
        collector.max:
            policy: 'fixed_window'
            limit: 1
            interval: '10 seconds'
        # Self-hosted edition: no limit on metric pushes.
        collector.selfhosted:
            policy: 'no_limit'
