security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build|site.webmanifest)/
            security: false
        collector:
            host: 'collector.%app.domain%'
            security: false
        jmonitor:
            pattern: ^/jmonitor/php-metrics$
            security: false
        main:
            lazy: true
            provider: app_user_provider
            switch_user: true
            form_login:
                login_path: /login
                check_path: /login/check
                enable_csrf: true
                csrf_token_id: authenticate
                csrf_parameter: _csrf_token
                default_target_path: /
                #always_use_default_target_path: true
            custom_authenticator:
                - App\Security\Authenticator\GoogleAuthenticator
            entry_point: App\Security\Authenticator\GoogleAuthenticator
            logout:
                path: /logout
                target: security.login
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 31536000 # 1 year
                always_remember_me: true
                signature_properties: [ 'email' ] # pas de password en cas de login oauth
            login_throttling:
                max_attempts: 5 # 5 / min

            # Activate different ways to authenticate:
            # https://symfony.com/doc/current/security.html#the-firewall

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

    # Note: Only the *first* matching rule is applied
    access_control:
        # admin
        - { path: ^/, roles: ROLE_ADMIN, host: 'admin.%app.domain%' }

        # Dashboard
        - { path: ^/(login|register|password-), roles: PUBLIC_ACCESS }

        # Public embeds: authorization is the embed token itself
        - { path: ^/e/, roles: PUBLIC_ACCESS, host: 'dash.%app.domain%' }
        - { path: ^/, roles: ROLE_USER, host: 'dash.%app.domain%' }

        # webhooks
        - { path: ^/$, roles: PUBLIC_ACCESS, host: 'webhook.%app.domain%' }

        # front
        - { path: ^/$, roles: PUBLIC_ACCESS }

    role_hierarchy:
        ROLE_ADMIN: [ROLE_USER, ROLE_ALLOWED_TO_SWITCH]

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
