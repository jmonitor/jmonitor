zenstruck_messenger_monitor:
    storage:
        orm:
            entity_class: App\Entity\ProcessedMessage
        # Mails exclus du monitoring : leur description (sujet + destinataire, stampée
        # à l'envoi et sérialisée dans l'enveloppe) peut dépasser le VARCHAR(255) de
        # messenger_processed_messages — l'INSERT échouerait (SQLSTATE 22001) et
        # tuerait le worker à chaque redélivrance du même message.
        exclude:
            - Symfony\Component\Mailer\Messenger\SendEmailMessage
