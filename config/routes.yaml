# yaml-language-server: $schema=../vendor/symfony/routing/Loader/schema/routing.schema.json

# This file is the entry point to configure the routes of your app.
# Methods with the #[Route] attribute are automatically imported.
# See also https://symfony.com/doc/current/routing.html

# To list all registered routes, run the following command:
#   bin/console debug:router

collectors:
    resource:
        path: ../src/Controller/Collector/
        namespace: App\Controller\Collector
    type: attribute
    host: 'collector.%app.domain%'

# Same controllers on an internal Host, for agents that reach the app from inside its
# own network. The self-hosted collector container needs this when APP_DOMAIN is under
# .localhost: libcurl resolves *.localhost to loopback (RFC 6761) and never asks Docker
# DNS, so it posts to the compose service name instead. An addition, not a replacement —
# agents on other servers keep using collector.<domain>.
collectors_internal:
    resource:
        path: ../src/Controller/Collector/
        namespace: App\Controller\Collector
    type: attribute
    name_prefix: internal_
    host: '%app.collector_internal_host%'

dash:
    resource:
        path: ../src/Controller/Dash/
        namespace: App\Controller\Dash
    type: attribute
    host: 'dash.%app.domain%'

admin:
    resource:
        path: ../src/Controller/Admin/
        namespace: App\Controller\Admin
    type: attribute
    host: 'admin.%app.domain%'
