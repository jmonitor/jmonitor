# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    .container.dumper.inline_factories: true # https://symfony.com/doc/current/performance.html#dump-the-service-container-into-a-single-file
    app.domain: '%env(APP_DOMAIN)%'
    menu.default_cache_tag: 'menu'
    stripe.portal_url: '%env(STRIPE_PORTAL_URL)%'
    app.mailer_sender_email: '%env(MAILER_SENDER_EMAIL)%'
    # Sender of alert emails: ALERT_MAIL_FROM, falling back to MAILER_SENDER_EMAIL when
    # empty or absent — so a self-hoster only has to configure a single address.
    app.alert_mail_from: '%env(default:app.mailer_sender_email:ALERT_MAIL_FROM)%'
    # Collector agent config: cloud defaults, overridable per env var by the
    # self-hosted stack (docker/selfhosted/compose.yaml). The default: env
    # processor falls back to the parameter when the env var does not exist.
    app.jmonitor_mysql_db: 'jmonitor'
    app.jmonitor_php_endpoint: 'http://localhost:8080/jmonitor/php-metrics'
    app.jmonitor_caddy_endpoint: 'http://localhost:2019/metrics'
    app.php_metrics_host_default: 'localhost'
    app.php_metrics_host: '%env(default:app.php_metrics_host_default:JMONITOR_PHP_METRICS_HOST)%'
    # Second Host the metrics endpoint answers on, for agents living inside the same
    # network as the app (self-hosted: the collector container posts to the compose
    # service name). Defaults to the public host, so nothing extra is exposed elsewhere.
    app.collector_host_default: 'collector.%app.domain%'
    app.collector_internal_host: '%env(default:app.collector_host_default:JMONITOR_COLLECTOR_INTERNAL_HOST)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # A PSR-18 client wrapping Symfony's default HTTP client, so it inherits its options
    # (notably verify_peer: false in dev).
    jmonitor_http_client:
        class: Symfony\Component\HttpClient\Psr18Client
        arguments:
            - '@http_client'

    # Monolog handler for prod error emails (referenced by config/packages/monolog.yaml).
    # The factory returns a NullHandler when ERROR_MAIL_TO is empty or absent (a self-hoster
    # who does not want error emails); errors then stay in error_log.
    app.monolog.error_mailer_handler:
        class: Monolog\Handler\HandlerInterface
        factory: ['@App\Logging\ErrorMailerHandlerFactory', 'create']

    # The edition (cloud / selfhosted) as an injectable service. The env var is resolved
    # at runtime, when the service is instantiated.
    # autoconfigure: false because FrameworkExtension autoconfigures \UnitEnum::class with
    # the "container.excluded" tag (every enum is excluded from autowiring by default):
    # without this flag the tag would also apply to this manual definition and break the
    # injection of App\Plan\Edition into the services that typehint it (e.g. PlanResolver).
    App\Plan\Edition:
        factory: ['App\Plan\Edition', 'from']
        arguments: ['%env(APP_EDITION)%']
        autoconfigure: false

when@dev:
    services:
        # Standalone DBAL connection to the dockerized PostgreSQL demo instance
        # (docker/pg-demo, a separate compose stack publishing 5433 on the host —
        # reached through host.docker.internal from the app container). Used only
        # by the Jmonitor PostgreSQL collector so we can test the Postgres
        # dashboard without changing the app's main (MySQL) connection.
        #   docker compose -f docker/pg-demo/compose.yaml up -d
        app.pg_demo_connection:
            class: Doctrine\DBAL\Connection
            factory: ['Doctrine\DBAL\DriverManager', 'getConnection']
            arguments:
                -
                    driver: 'pdo_pgsql'
                    host: 'host.docker.internal'
                    port: 5433
                    dbname: 'shop'
                    user: 'jmonitor'
                    password: 'jmonitor'
