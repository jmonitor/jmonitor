; PHP configuration of the self-hosted image (docker/selfhosted/Dockerfile).
; The repository php.ini targets the Clever Cloud deployment (opcache.preload
; without preload_user, Europe/Paris timezone) and is NOT used here.

[PHP]
expose_php = Off
memory_limit = 256M
log_errors = On
max_execution_time = 30

realpath_cache_size = 8192K
realpath_cache_ttl = 3600

[Date]
; Default only: the entrypoint materializes the TZ env var as a conf.d
; override (zz-timezone.ini), parsed after this file.
date.timezone = UTC

[opcache]
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; The code in the image is immutable — never stat PHP files.
opcache.validate_timestamps = 0

[apcu]
; APCu backs the Symfony system caches.
apc.enabled = 1
apc.shm_size = 32M
