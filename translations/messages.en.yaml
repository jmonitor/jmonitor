metric.redis.max_memory_policy.description.noeviction: When memory is full and a new write is attempted, Redis rejects the operation and returns an error.
metric.redis.max_memory_policy.description.allkeys-lru: When memory is full and a new write is attempted, Redis evicts the least recently used keys from the entire dataset.
metric.redis.max_memory_policy.description.volatile-lru: When memory is full and a new write is attempted, Redis evicts the least recently used keys among those with an expiration set.
metric.redis.max_memory_policy.description.allkeys-lfu: When memory is full and a new write is attempted, Redis evicts the least frequently used keys from the entire dataset.
metric.redis.max_memory_policy.description.volatile-lfu: When memory is full and a new write is attempted, Redis evicts the least frequently used keys among those with an expiration set.
metric.redis.max_memory_policy.description.allkeys-random: When memory is full and a new write is attempted, Redis evicts random keys from the entire dataset.
metric.redis.max_memory_policy.description.volatile-random: When memory is full and a new write is attempted, Redis evicts random keys among those with an expiration set.
metric.redis.max_memory_policy.description.volatile-ttl: When memory is full and a new write is attempted, Redis evicts keys with an expiration set, prioritizing those with the shortest remaining TTL.
